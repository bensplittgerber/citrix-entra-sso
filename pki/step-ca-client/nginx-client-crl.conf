# Inside the existing `server { listen 80 default_server; ... }` block of the CRL web server.
# Variable + Docker resolver: nginx still starts (and serves the other paths) when step-ca-client is down or gets a
# new container IP; only /client/crl answers 502 then. Keep everything else on :80 at 404.
resolver 127.0.0.11 valid=30s ipv6=off;
location = /client/crl {
  limit_except GET HEAD { deny all; }
  set $client_ca step-ca-client;
  proxy_pass https://$client_ca:9000/1.0/crl;
  proxy_ssl_verify off;
}
location / { return 404; }
