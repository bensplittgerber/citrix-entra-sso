<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Citrix Entra SSO without FAS - architecture and logon flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b6cbd"/>
    </marker>
    <style>
      .box  { fill: #ffffff; stroke: #9aa7b4; stroke-width: 1.5; }
      .zone { fill: #f4f6f8; stroke: #c9d1d9; stroke-width: 1; stroke-dasharray: 6 4; }
      .entra { fill: #eaf3fc; stroke: #0b6cbd; stroke-width: 1.5; }
      .h    { font-size: 17px; font-weight: 600; fill: #1f2933; }
      .t    { font-size: 13px; fill: #3b4a5a; }
      .s    { font-size: 12px; fill: #5b6b7b; }
      .zt   { font-size: 13px; font-weight: 600; fill: #7b8794; letter-spacing: .5px; }
      .ln   { stroke: #3b4a5a; stroke-width: 1.8; fill: none; marker-end: url(#a); }
      .le   { stroke: #0b6cbd; stroke-width: 1.8; fill: none; marker-end: url(#e); stroke-dasharray: 7 4; }
      .n    { fill: #1f2933; } .nt { font-size: 13px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .ne   { fill: #0b6cbd; }
      .lbl  { font-size: 12px; fill: #1f2933; }
      .lble { font-size: 12px; fill: #0b5394; }
    </style>
  </defs>
  <rect width="1200" height="830" fill="#ffffff"/>

  <!-- Entra ID -->
  <rect class="entra" x="300" y="20" width="880" height="150" rx="10"/>
  <text class="h" x="320" y="48">Microsoft Entra ID</text>
  <rect class="box" x="320" y="62" width="270" height="94" rx="6"/>
  <text class="t" x="332" y="84" font-weight="600">Client application (per Gateway)</text>
  <text class="s" x="332" y="104">OIDC for the Gateway (user name = oid)</text>
  <text class="s" x="332" y="122">SPA redirect URI = Store Web URL with /</text>
  <text class="s" x="332" y="140">ctxaadsso:// for native Workspace app</text>
  <rect class="box" x="605" y="62" width="300" height="94" rx="6"/>
  <text class="t" x="617" y="84" font-weight="600">Citrix-Workspace-Resource (3a510bb1-...)</text>
  <text class="s" x="617" y="104">RDS protocol enabled, approved client app</text>
  <text class="s" x="617" y="122">target device group (VDAs)</text>
  <text class="s" x="617" y="140">token audience ms-device-service://...</text>
  <rect class="box" x="920" y="62" width="245" height="94" rx="6"/>
  <text class="t" x="932" y="84" font-weight="600">Conditional Access</text>
  <text class="s" x="932" y="104">phishing-resistant MFA</text>
  <text class="s" x="932" y="122">(passkey / Windows Hello)</text>
  <text class="s" x="932" y="140">hybrid joined VDA devices</text>

  <!-- zones -->
  <rect class="zone" x="20" y="200" width="250" height="520" rx="10"/>
  <text class="zt" x="36" y="224">CLIENT</text>
  <rect class="zone" x="300" y="200" width="250" height="520" rx="10"/>
  <text class="zt" x="316" y="224">DMZ</text>
  <rect class="zone" x="580" y="200" width="600" height="520" rx="10"/>
  <text class="zt" x="596" y="224">DATA CENTER</text>

  <!-- Client -->
  <rect class="box" x="36" y="240" width="218" height="130" rx="6"/>
  <text class="h" x="48" y="264">Browser</text>
  <text class="t" x="48" y="286">Edge / Chrome, Entra session</text>
  <text class="s" x="48" y="306">HTML5: msal in the store page</text>
  <text class="s" x="48" y="324">hybrid: Citrix Web Extension</text>
  <text class="s" x="48" y="342">(allowed on the store site,</text>
  <text class="s" x="48" y="360">store on port 443)</text>
  <rect class="box" x="36" y="390" width="218" height="96" rx="6"/>
  <text class="h" x="48" y="414">Workspace app</text>
  <text class="s" x="48" y="436">hybrid launch from the extension</text>
  <text class="s" x="48" y="454">hands the Entra token to the VDA</text>
  <text class="s" x="48" y="472">needs ISRG Root X1 (Let's Encrypt)</text>
  <rect class="box" x="36" y="506" width="218" height="96" rx="6"/>
  <text class="h" x="48" y="530">Authenticators</text>
  <text class="s" x="48" y="552">Entra: passkey (FIDO2) or</text>
  <text class="s" x="48" y="570">Windows Hello / PRT</text>
  <text class="s" x="48" y="588">mTLS (optional): smart card PIV</text>

  <!-- Gateway -->
  <rect class="box" x="316" y="240" width="218" height="362" rx="6"/>
  <text class="h" x="328" y="264">NetScaler Gateway</text>
  <text class="t" x="328" y="288">TLS 443 (Let's Encrypt chain</text>
  <text class="t" x="328" y="306">incl. Root YR by ISRG Root X1)</text>
  <text class="s" x="328" y="332">optional mTLS: clientCert</text>
  <text class="s" x="328" y="350">Mandatory (no logon page</text>
  <text class="s" x="328" y="368">without certificate)</text>
  <text class="t" x="328" y="398" font-weight="600">nFactor</text>
  <text class="s" x="328" y="418">1 certificate check (NO_AUTHN)</text>
  <text class="s" x="328" y="436">2 OIDC to Entra, userNameField oid</text>
  <text class="t" x="328" y="466" font-weight="600">Rewrite to StoreFront</text>
  <text class="s" x="328" y="486">X-Citrix-OIDC-Access-Token</text>
  <text class="t" x="328" y="516" font-weight="600">ICA proxy (HDX)</text>
  <text class="s" x="328" y="536">STA ticket from the Controller</text>
  <text class="s" x="328" y="554">client cert again for HDX</text>
  <text class="s" x="328" y="572">(Workspace app PIN prompt)</text>

  <!-- StoreFront -->
  <rect class="box" x="600" y="240" width="250" height="150" rx="6"/>
  <text class="h" x="612" y="264">StoreFront</text>
  <text class="s" x="612" y="286">store with Entra SSO enabled</text>
  <text class="s" x="612" y="304">(no FAS), modern UI ("Workspace")</text>
  <text class="s" x="612" y="322">auth: CitrixAGBasic + Federation</text>
  <text class="s" x="612" y="340">Entra tenant per store</text>
  <text class="s" x="612" y="358">one Gateway entry per host</text>
  <text class="s" x="612" y="376">callback to the Gateway</text>

  <!-- Controller -->
  <rect class="box" x="600" y="470" width="250" height="132" rx="6"/>
  <text class="h" x="612" y="494">Delivery Controller</text>
  <text class="s" x="612" y="516">Broker site (site-wide):</text>
  <text class="s" x="612" y="534">AzureSSOnClientId, AuthorizeUrl,</text>
  <text class="s" x="612" y="552">RedirectUrl = Store Web URL /</text>
  <text class="s" x="612" y="570">-> one Entra SSO store per site</text>
  <text class="s" x="612" y="588">STA for the Gateway</text>

  <!-- VDA -->
  <rect class="box" x="930" y="300" width="232" height="230" rx="6"/>
  <text class="h" x="942" y="324">VDA (Windows)</text>
  <text class="s" x="942" y="346">Entra hybrid joined</text>
  <text class="s" x="942" y="364">delivery group logon type</text>
  <text class="s" x="942" y="382">HybridAzureAd</text>
  <text class="s" x="942" y="408">CloudAP checks the token</text>
  <text class="s" x="942" y="426">(device id, nonce, approved</text>
  <text class="s" x="942" y="444">client) and gets the user's</text>
  <text class="s" x="942" y="462">PRT -> Windows logon</text>
  <text class="s" x="942" y="480">without password</text>
  <text class="s" x="942" y="506">failure: CloudAP 0xC0048422</text>

  <!-- flow: client -> gateway -->
  <path class="ln" d="M254,280 L316,280"/>
  <circle class="n" cx="285" cy="266" r="10"/><text class="nt" x="285" y="271">1</text>
  <!-- gateway -> entra (OIDC) -->
  <path class="le" d="M425,240 L425,170"/>
  <circle class="ne" cx="440" cy="205" r="10"/><text class="nt" x="440" y="210">2</text>
  <!-- gateway -> storefront -->
  <path class="ln" d="M534,300 L600,300"/>
  <circle class="n" cx="567" cy="286" r="10"/><text class="nt" x="567" y="291">3</text>
  <!-- storefront <-> controller -->
  <path class="ln" d="M725,390 L725,470"/>
  <circle class="n" cx="740" cy="430" r="10"/><text class="nt" x="740" y="435">4</text>
  <!-- browser -> entra token for resource -->
  <path class="le" d="M145,240 L145,185 Q145,175 155,175 L700,175 L700,156"/>
  <circle class="ne" cx="200" cy="175" r="10"/><text class="nt" x="200" y="180">5</text>
  <!-- workspace app -> gateway -> vda HDX -->
  <path class="ln" d="M254,440 L316,440"/>
  <path class="ln" d="M534,560 Q570,560 570,640 L1040,640 L1040,530"/>
  <circle class="n" cx="285" cy="426" r="10"/><text class="nt" x="285" y="431">7</text>
  <!-- browser -> workspace app (token handoff) -->
  <path class="le" d="M200,370 L200,388"/>
  <circle class="ne" cx="220" cy="380" r="10"/><text class="nt" x="220" y="385">6</text>
  <!-- vda -> entra -->
  <path class="le" d="M1046,300 L1046,156"/>
  <circle class="ne" cx="1061" cy="230" r="10"/><text class="nt" x="1061" y="235">8</text>
  <!-- controller -> vda -->
  <path class="ln" d="M850,520 L930,480"/>

  <!-- legend -->
  <g transform="translate(20,748)">
    <text class="lbl" x="0" y="0">1  user opens the store URL (TLS, optional client certificate)</text>
    <text class="lbl" x="0" y="20">2  Gateway signs the user in with Entra (OIDC, MFA)</text>
    <text class="lbl" x="0" y="40">3  Gateway passes the Entra access token to StoreFront</text>
    <text class="lbl" x="0" y="60">4  launch: ICA file with the site-wide AzureSSOn* values</text>
    <text class="lble" x="600" y="0">5  browser (store page or Web Extension) gets a token for</text>
    <text class="lble" x="618" y="16">Citrix-Workspace-Resource, scope .../id/&lt;VDA device id&gt;</text>
    <text class="lble" x="600" y="34">6  hybrid: the Web Extension hands the token to Workspace app</text>
    <text class="lbl" x="600" y="50">7  HDX through the Gateway; the token goes to the VDA</text>
    <text class="lble" x="600" y="66">8  VDA (CloudAP) redeems the token with Entra, user signed in</text>
  </g>
</svg>
